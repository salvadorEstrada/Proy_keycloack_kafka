server:
  #port: 8084
  port: 0
spring:
  application:
    name: msvc-inventory
  datasource:
    drive-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5431/msvc-inventory
    username: salva
    password: Test@32
  jpa:
    hibernate:
      ddl-auto: create
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8181/realms/microservices-realm/protocol/openid-connect/certs

eureka:
  client:
    jersey:
      enabled: false # 👈 Aquí desactivas el cliente de Jersey conflictivo
    service-url:
      defaultZone: http://eureka:password@localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}








